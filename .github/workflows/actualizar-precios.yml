name: Actualizar precios

on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:
    inputs:
      supermercado:
        description: "dia, ahorramas o vacío para los dos"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: actualizar-precios
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm test

      - name: Leer catálogos
        run: node scripts/scrape.mjs ${{ github.event.inputs.supermercado }}

      - name: Guardar cambios
        if: always()
        run: |
          git config user.name "mi-cesta-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los precios"
          else
            git commit -m "Precios actualizados $(date -u +%Y-%m-%d)"
            git push
          fi
