name: Mantener Supabase activo

on:
  schedule:
    - cron: "23 7 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Llamar a la base de datos
        run: |
          SUPABASE_URL=$(sed -n 's/^export const SUPABASE_URL = "\(.*\)";$/\1/p' config.js)
          SUPABASE_KEY=$(sed -n 's/^export const SUPABASE_KEY = "\(.*\)";$/\1/p' config.js)
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "No se encontraron SUPABASE_URL y SUPABASE_KEY en config.js" >&2
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 10 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/cesta_ping" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
